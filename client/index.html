<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Corte e Poda de Árvores | Sérgio — Mais de 20 Anos de Experiência</title>
    <meta name="description" content="Serviços de corte, poda e limpeza de árvores e coqueiros, com mais de 20 anos de experiência. Atendimento profissional e cuidadoso em Ibiúna/SP, inclusive em locais próximos a casas e muros." />
    <meta name="theme-color" content="#173326" />
    <meta property="og:title" content="Sérgio Corte & Poda — experiência que faz diferença" />
    <meta property="og:description" content="Corte, poda e limpeza de árvores e coqueiros em Ibiúna/SP. Fale diretamente com Sérgio pelo WhatsApp." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const analyticsEndpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;

      if (analyticsEndpoint && websiteId) {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${analyticsEndpoint.replace(/\/+$/, "")}/umami`;
        script.setAttribute("data-website-id", websiteId);
        document.head.appendChild(script);
      }
    </script>
  </body>

</html>
